services:
  liloidc:
    build: .
    ports:
      - "${PORT:-9876}:${PORT:-9876}"
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./clients.json:/app/clients.json:ro
      - ./users.json:/app/users.json:ro

  # Profil kemluid: meniru KemluID (OpenIddict) untuk uji lokal tte-web. Opt-in:
  #   docker compose --profile kemluid up -d liloidc-kemluid
  # Dokumentasi: profiles/kemluid/README.md
  liloidc-kemluid:
    build: .
    profiles: [kemluid]
    ports:
      - "9877:9877"
    environment:
      PORT: 9877
      ISSUER: http://localhost:9877
      LILO_PROFILE: kemluid
    restart: unless-stopped
    volumes:
      # Seluruh folder profil: clients.json lokal dipakai bila ada, bila tidak clients.example.json.
      - ./profiles/kemluid:/app/profiles/kemluid:ro
